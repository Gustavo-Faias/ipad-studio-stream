[package]
name = "padstudio-streaming"
description = "Multi-streaming do PadStudio: um FFmpeg por destino (Twitch, YouTube, TikTok) alimentado pelo motor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
padstudio-engine = { path = "../engine" }
padstudio-protocol = { path = "../protocol" }
bytes = "1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
padstudio-audio = { path = "../audio" }
