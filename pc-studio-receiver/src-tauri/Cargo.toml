[package]
name = "pc-studio-receiver"
description = "PadStudio — recetor do ecrã do iPad e estúdio de multi-streaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pc_studio_receiver_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
padstudio-audio = { path = "../crates/audio" }
padstudio-engine = { path = "../crates/engine" }
padstudio-protocol = { path = "../crates/protocol" }
padstudio-streaming = { path = "../crates/streaming" }
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tungstenite = "0.30"
