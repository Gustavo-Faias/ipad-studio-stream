[workspace]
resolver = "3"
members = ["src-tauri", "crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Dependências otimizadas mesmo em debug: o pipeline de media fica utilizável sem --release.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
